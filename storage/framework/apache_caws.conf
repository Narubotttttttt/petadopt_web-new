ServerRoot "C:/xampp/apache"
Listen 8000
ServerName localhost:8000

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule alias_module modules/mod_alias.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"

PHPIniDir "C:/xampp/php"
AddHandler application/x-httpd-php .php

<IfModule mpm_winnt_module>
    ThreadsPerChild 64
    MaxConnectionsPerChild 0
</IfModule>

KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
Timeout 120

TypesConfig "C:/xampp/apache/conf/mime.types"

<IfModule dir_module>
    DirectoryIndex index.php index.html
</IfModule>

PidFile "C:/Users/Junar/pet-adoption-system/storage/logs/apache_caws.pid"
ErrorLog "C:/Users/Junar/pet-adoption-system/storage/logs/apache_error.log"
LogLevel warn

DocumentRoot "C:/Users/Junar/pet-adoption-system/public"
<Directory "C:/Users/Junar/pet-adoption-system/public">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<IfModule deflate_module>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json image/svg+xml
</IfModule>